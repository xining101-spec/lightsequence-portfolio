<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Stephanie Chang — Visual Storytelling</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eee9df;
      font-family: Georgia, "Noto Serif TC", serif;
      color: #453f38;
    }

    .portfolio {
      width: 100%;
      text-align: center;
      padding: 40px 20px;
    }

    .name {
      margin-bottom: 8px;
      font-size: 18px;
      font-weight: normal;
      letter-spacing: 0.08em;
    }

    .subtitle {
      margin-bottom: 48px;
      font-size: 13px;
      letter-spacing: 0.14em;
      opacity: 0.65;
    }

    .book {
      position: relative;
      width: min(62vw, 320px);
      aspect-ratio: 260 / 210;
      margin: 0 auto;
      cursor: pointer;
      perspective: 1200px;
    }

    .book-back {
      position: absolute;
      inset: 0;
      background: #d9d0c1;
      border-radius: 3px 8px 8px 3px;
      box-shadow:
        0 24px 45px rgba(70, 58, 45, 0.18),
        0 5px 12px rgba(70, 58, 45, 0.12);
    }

    .cover {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 28px;

      background: #f7f2e9;
      border-radius: 3px 8px 8px 3px;

      transform-origin: left center;
      transform-style: preserve-3d;

      transition:
        transform 1.1s cubic-bezier(.22,.72,.22,1),
        box-shadow 1.1s ease;

      box-shadow:
        inset 12px 0 20px rgba(80, 65, 50, 0.06),
        0 2px 3px rgba(80, 65, 50, 0.08);

      backface-visibility: hidden;
    }

    .cover::before {
      content: "";
      position: absolute;
      left: 12px;
      top: 0;
      bottom: 0;
      width: 1px;
      background: rgba(80, 65, 50, 0.12);
    }

    .cover-title {
      font-size: clamp(20px, 4vw, 28px);
      font-weight: normal;
      letter-spacing: 0.06em;
      margin-bottom: 14px;
    }

    .cover-line {
      width: 38px;
      height: 1px;
      background: #9e4050;
      margin-bottom: 16px;
    }

    .cover-small {
      font-size: 11px;
      letter-spacing: 0.16em;
      opacity: 0.55;
    }

    .book.open .cover {
      transform: rotateY(-155deg);
      box-shadow:
        12px 10px 25px rgba(70, 58, 45, 0.12);
    }

    .hint {
      margin-top: 34px;
      font-size: 12px;
      letter-spacing: 0.08em;
      opacity: 0.48;
    }

    @media (orientation: landscape) {
      .book {
        width: min(36vw, 340px);
      }

      .portfolio {
        padding: 24px;
      }

      .subtitle {
        margin-bottom: 32px;
      }
    }
  </style>
</head>

<body>

  <main class="portfolio">

    <h1 class="name">Stephanie Chang</h1>

    <div class="subtitle">
      VISUAL STORYTELLING
    </div>

    <div class="book" id="book">

      <div class="book-back"></div>

      <div class="cover">
        <div class="cover-title">Selected Works</div>
        <div class="cover-line"></div>
        <div class="cover-small">LIGHT SEQUENCE</div>
      </div>

    </div>

    <div class="hint">
      Click the book to open
    </div>

  </main>

  <script>
    const book = document.getElementById("book");

    book.addEventListener("click", function () {
      book.classList.toggle("open");
    });
  </script>

</body>
</html>
